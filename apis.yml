name: Luko
description: 'Luko is an online home, travel, and auto insurance provider founded in France in 2016 and
  now operating as Luko by Allianz Direct after its acquisition by the Allianz group. It sells rental,
  owner-occupied, non-occupant-owner (PNO), student, and co-housing home policies from around EUR 5 per
  month, plus travel and Eurofil-partnered auto cover, with sub-two-minute online subscription, instant
  attestations, digital claims declaration through a customer account portal, and 24/7 emergency support.
  Originally a VC-backed insurtech (Accel, Speedinvest), Luko today runs as a consumer insurance brand
  with no public developer API, SDK, or API documentation surface; this profile captures its verifiable
  security and identity footprint.'
